name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run api:check        # deployed function bundles must match server/ sources
      - run: npm run facts:check      # computed facts must match the generator
      - run: npm run registry:check   # generated registry must match the curated data
      - run: npm test
      - run: npm run build
        env:
          VITE_THUNDERFOREST_API_KEY: ""
      - run: npm run check:budget
      - run: npm run check:secrets
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
